<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYB | Profile</title>
    <style>
        /* Reset margins and establish layout box-sizing properties globally */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #020208;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Interactive Overlay Gate for Autoplay Compatibility across modern browsers */
        #overlay-gate {
            position: fixed;
            inset: 0;
            background: #05050c;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #overlay-gate h2 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            animation: pulseText 2s infinite;
        }
        #overlay-gate p {
            font-size: 0.8rem;
            color: #4ea3ff;
            letter-spacing: 1px;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Creative Cosmic Radial Gradient Layering */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(13, 71, 161, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(21, 101, 192, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(10, 10, 25, 1) 0%, #020205 100%);
            z-index: 1;
        }
        
        /* Animated Ambient Particle Star Dust */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            animation: drift 25s linear infinite;
            opacity: 0.4;
        }
        @keyframes drift {
            from { background-position: 0 0, 40px 60px; }
            to { background-position: 550px 1100px, 390px 760px; }
        }

        /* Profile Card Housing Container */
        .card {
            position: relative;
            z-index: 2;
            width: 360px;
            background: rgba(4, 8, 20, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(78, 163, 255, 0.2);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(13, 71, 161, 0.2);
        }
        
        /* Profile Image Avatar Formatting */
        .avatar {
            display: block;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 20px; 
            object-fit: cover;
            border: 2px solid rgba(78, 163, 255, 0.6);
            box-shadow: 0 0 25px rgba(13, 71, 161, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.06) rotate(1deg);
            border-color: #4ea3ff;
            box-shadow: 0 0 35px rgba(78, 163, 255, 0.7);
        }

        /* Glitch Typography Rendering Architecture */
        .glitch-title {
            position: relative;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
            color: #fff;
            text-shadow: 0.05em 0 0 rgba(255, 0, 85, 0.75),
                        -0.025em -0.05em 0 rgba(0, 76, 255, 0.75),
                        0.025em 0.05em 0 rgba(0, 255, 119, 0.75);
            animation: glitch 500ms infinite;
        }
        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 rgba(255, 0, 85, 0.75), -0.025em -0.05em 0 rgba(0, 76, 255, 0.75), 0.025em 0.05em 0 rgba(0, 255, 119, 0.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 85, 0.75), 0.025em 0.025em 0 rgba(0, 76, 255, 0.75), -0.05em -0.05em 0 rgba(0, 255, 119, 0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 85, 0.75), 0.05em 0 0 rgba(0, 76, 255, 0.75), 0 -0.05em 0 rgba(0, 255, 119, 0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255, 0, 85, 0.75), -0.025em -0.025em 0 rgba(0, 76, 255, 0.75), -0.025em -0.05em 0 rgba(0, 255, 119, 0.75); }
        }

        /* Actionable Social Button Direct Links */
        .links a {
            display: block;
            margin: 12px 0;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0d47a1 0%, #0a2d66 100%);
            border: 1px solid rgba(78, 163, 255, 0.15);
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .links a:hover {
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 71, 161, 0.5);
            border-color: rgba(78, 163, 255, 0.4);
        }

        /* Clean Minimalist Text Counter Display Layout */
        .counter-box {
            margin-top: 28px;
            font-size: 0.85rem;
            color: #708090;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .counter-val {
            font-family: monospace;
            font-size: 1rem;
            color: #4ea3ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="overlay-gate" onclick="enterSite()">
        <h2>PERFECT TIMING</h2>
        <p>TAP TO ENTER</p>
    </div>

    <div class="bg-glow"></div>
    <div class="particles"></div>

    <div class="card">
        <img class="avatar" src="pfp.png" alt="BYB Profile Picture">
        
        <h1 class="glitch-title">.BYB</h1>

        <div class="links">
            <a href="https://www.instagram.com/byb_jc/" target="_blank">Instagram</a>
            <a href="https://www.tiktok.com/@loejc15" target="_blank">TikTok</a>
            <a href="https://www.twitch.tv/byb_jc" target="_blank">Twitch</a>
            <a href="https://discord.com" target="_blank">Discord</a>
        </div>

        <audio id="bg-music" loop>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <div class="counter-box">
            <span>Views:</span>
            <span class="counter-val" id="view-count">Loading...</span>
        </div>
    </div>

    <script>
        // Calls the dynamic hit tracking service to display actual concurrent site entry events
        async function updateLiveCounter() {
            try {
                const response = await fetch('https://count.getloli.com/get/@byb_jc_profile_views?theme=asoul');
                const data = await response.json();
                if(data && data.value) {
                    document.getElementById('view-count').innerText = data.value.toLocaleString();
                } else {
                    document.getElementById('view-count').innerText = "1";
                }
            } catch (error) {
                document.getElementById('view-count').innerText = "1";
            }
        }

        // Initialize view tracker execution
        updateLiveCounter();

        // Destroys overlay blocking element and releases configured audio buffers cleanly on click action
        function enterSite() {
            const gate = document.getElementById('overlay-gate');
            const audio = document.getElementById('bg-music');
            
            gate.style.opacity = '0';
            gate.style.visibility = 'hidden';
            
            audio.play().catch(err => {
                console.log("Autoplay buffer error handled:", err);
            });
        }
    </script>
</body>
</html>
